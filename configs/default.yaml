device: cuda:0
vehicle_model: rfdetr-large
plate_model: rtdetr-v2-r50
ocr_model: cct-s-v2-global-model
ocr_engine: fast-plate-ocr
paddle_ocr_fallback: false
paddle_ocr_trigger_score: 0.82
vehicle_threshold: 0.35
plate_threshold: 0.25
ocr_read_threshold: 0.82
min_plate_width_px: 48
blur_laplacian_min: 18.0
vehicle_crop_margin: 0.12
plate_crop_margin: 0.08
video_frame_stride: 1
tracker_track_activation_threshold: 0.25
tracker_lost_track_buffer: 45
tracker_match_threshold: 0.8
track_history_size: 12
minimum_consensus_observations: 2
save_plate_crops: false
write_video_fps: source
log_level: INFO
# Recognition gates are raw model heuristics, not calibrated probabilities.
plate_read_threshold: 0.40
ocr_min_char_threshold: 0.55
ocr_track_mean_threshold: 0.74
ocr_track_min_char_threshold: 0.50
min_plate_height_px: 12
min_plate_contrast: 25.0
association_min_containment: 0.60
association_min_margin: 0.20
paddle_evidence_threshold: 0.85
track_min_evidence_gap_ms: 200
track_min_consensus_margin: 0.35
track_min_consensus_fraction: 0.70
recovery_views: false
vehicle_tiles: false
plate_tiles: false
video_decode_limit: 180000
max_frame_pixels: 16777216
max_batch_images: 100
ui_preview_rows: 2000
# Low detector scores may extend an existing track. They cannot create visible standalone detections.
vehicle_tracking_proposal_threshold: 0.15
track_min_class_fraction: 0.75
# RT-DETR plate crops share a forward pass. Use 1 on memory-constrained GPUs.
plate_inference_batch_size: 4
cpu_inference_threads: 4
video_decoder_threads: 4
